name: Publish Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build SDK and Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use semantic version format vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must each be between 0 and 999."
            exit 1
          fi

          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range."
            exit 1
          fi

          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build SDK AAR and demo APK
        run: |
          ./gradlew \
            :riskengine-sdk:test \
            :riskengine-sdk:lint \
            :riskengine-sdk:assembleRelease \
            :riskengine-sdk:sourceReleaseJar \
            :riskengine-sdk:generatePomFileForReleasePublication \
            :integration-test:assembleDebug \
            :demo:lintDebug \
            :demo:assembleDebug \
            -PreleaseVersionName="${{ steps.version.outputs.name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.code }}" \
            --no-daemon

      - name: Collect release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          mkdir -p release-artifacts

          sdk_aar="riskengine-sdk/build/outputs/aar/riskengine-sdk-release.aar"
          sdk_sources="riskengine-sdk/build/intermediates/source_jar/release/release-sources.jar"
          sdk_pom="riskengine-sdk/build/publications/release/pom-default.xml"
          demo_apk="demo/build/outputs/apk/debug/demo-debug.apk"

          if [[ ! -f "$sdk_aar" ]]; then
            echo "SDK AAR not found: $sdk_aar"
            exit 1
          fi

          if [[ ! -f "$sdk_sources" ]]; then
            echo "SDK sources JAR not found: $sdk_sources"
            exit 1
          fi

          if [[ ! -f "$sdk_pom" ]]; then
            echo "SDK POM not found: $sdk_pom"
            exit 1
          fi

          if [[ ! -f "$demo_apk" ]]; then
            echo "Demo APK not found: $demo_apk"
            exit 1
          fi

          cp "$sdk_aar" "release-artifacts/RiskEngine-SDK-${VERSION_NAME}.aar"
          cp "$sdk_sources" "release-artifacts/RiskEngine-SDK-${VERSION_NAME}-sources.jar"
          cp "$sdk_pom" "release-artifacts/RiskEngine-SDK-${VERSION_NAME}.pom"
          cp "$demo_apk" "release-artifacts/RiskEngine-Demo-${VERSION_NAME}-debug.apk"

          cd release-artifacts
          sha256sum ./*.aar ./*.jar ./*.pom ./*.apk > SHA256SUMS

          ls -lah

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --title "RiskEngine ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --notes "The Demo APK is intentionally signed with a temporary CI debug key and is provided only for sideload testing. It is not intended for production distribution or app stores. A later release may not install as an update because its temporary signing key can differ; uninstall the previous Demo first if Android reports a signature mismatch. No production signing secret is stored by this workflow."
