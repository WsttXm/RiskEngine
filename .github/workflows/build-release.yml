name: Publish Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Core SDK & Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android-env

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use semantic version format vMAJOR.MINOR.PATCH, for example v2.0.0."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor > 999 || patch > 999 )); then
            echo "MINOR and PATCH must each be between 0 and 999."
            exit 1
          fi

          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "Calculated Android versionCode is outside the supported range."
            exit 1
          fi

          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Verify Core SDK, Gates 1-6, L1+L2+L3 & Demo APK
        run: |
          ./scripts/ci-verify.sh \
            -PreleaseVersionName="${{ steps.version.outputs.name }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.code }}"

      - name: Collect and checksum release artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          rm -rf release-artifacts
          mkdir -p release-artifacts

          collect_module() {
            local mod_dir="$1"
            local out_prefix="$2"
            local aar="${mod_dir}/build/outputs/aar/${mod_dir}-release.aar"
            local sources="${mod_dir}/build/intermediates/source_jar/release/release-sources.jar"
            local pom="${mod_dir}/build/publications/release/pom-default.xml"

            for f in "$aar" "$sources" "$pom"; do
              if [[ ! -s "$f" ]]; then
                echo "Missing or empty release artifact for ${mod_dir}: $f" >&2
                exit 1
              fi
            done

            unzip -tq "$aar"
            unzip -tq "$sources"

            cp "$aar" "release-artifacts/${out_prefix}-${VERSION_NAME}.aar"
            cp "$sources" "release-artifacts/${out_prefix}-${VERSION_NAME}-sources.jar"
            cp "$pom" "release-artifacts/${out_prefix}-${VERSION_NAME}.pom"
          }

          collect_module "riskengine-sdk" "RiskEngine-SDK"

          demo_apk="demo/build/outputs/apk/debug/demo-debug.apk"
          if [[ ! -s "$demo_apk" ]]; then
            echo "Demo APK not found: $demo_apk" >&2
            exit 1
          fi
          unzip -tq "$demo_apk"
          cp "$demo_apk" "release-artifacts/RiskEngine-Demo-${VERSION_NAME}-debug.apk"

          cd release-artifacts
          LC_ALL=C ls -1 ./*.aar ./*.jar ./*.pom ./*.apk | sort | xargs sha256sum > SHA256SUMS

          cat SHA256SUMS
          ls -lah

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract-release-notes.py \
            --tag "$GITHUB_REF_NAME" \
            --changelog CHANGELOG.md \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --title "RiskEngine ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
