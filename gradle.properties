# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution for multi-module builds
org.gradle.parallel=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes
android.nonTransitiveRClass=true

# Shared Android toolchain versions (single source of truth for Gradle and GitHub Actions)
androidJavaVersion=17
androidCompileSdk=36
androidMinSdk=30
androidTargetSdk=36
androidBuildToolsVersion=35.0.0
androidCmakeVersion=3.22.1
androidNdkVersion=27.0.12077973

# Local builds are snapshots. Tag release workflows override releaseVersionName.
riskEngineVersion=1.1.0-SNAPSHOT
